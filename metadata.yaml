name: astrbot_plugin_user_blacklist
display_name: 用户黑名单
desc: 在配置界面填入 QQ 号即可屏蔽某个人，无论群聊还是私聊，其消息都会被静默忽略，不触发机器人任何回复。
help: 打开本插件配置，在「屏蔽名单」里填入 QQ 号（一行一个）保存即可；也可直接编辑插件目录下的 blacklist.json（保存即生效，无需重载）。
short_desc: 填入 QQ 号即可屏蔽该用户（群聊 + 私聊），静默忽略不回复。
version: 1.0.0
author: 枝祈
repo: https://github.com/yuqi-x/astrbot_plugin_user_blacklist
astrbot_version: ">=4.0.0"
tags:
